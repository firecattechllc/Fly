<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090e18"><title>FLY — Secure Access</title><link rel="stylesheet" href="/style.css"><script src="/auth.js" defer></script>
<style>
.auth-screen{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#19324a,#080e18 66%)}.auth-box{max-width:430px;width:100%;background:#111c2d;border:1px solid #304054;border-radius:14px;padding:36px;box-shadow:0 25px 80px #0004}.auth-box h1{margin:20px 0 8px;font-size:26px}.auth-box p{color:#a1b4c9;line-height:1.6}.auth-box label{display:block;margin-top:24px;font-size:11px;letter-spacing:1px;color:#a9bcd0}.auth-box input{margin-top:9px;width:100%}.auth-box button{margin-top:22px}.auth-note{border-top:1px solid #283750;padding-top:20px;margin-top:28px;font-size:11px;color:#829bb5}.auth-box .form-message{margin-top:14px}
</style></head>
<body><main class="auth-screen"><section class="auth-box"><div class="brand-icon" aria-hidden="true">FLY</div><div class="eyebrow" style="margin-top:20px">SECURE LOCAL WORKSPACE</div><h1 id="authHeading">Owner authentication</h1><p id="authIntro">Enter your FLY owner password to access the local portfolio intelligence console.</p>
<form id="authForm"><div><label for="password">OWNER PASSWORD</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="14" maxlength="128" required autofocus></div><button type="submit" class="primary-btn" id="submit">UNLOCK FLY <span>↗</span></button><p id="authMessage" aria-live="polite" class="form-message"></p></form>
<p class="auth-note">Local-only development environment · Paper trading only · No brokerage transactions. Your password is stored as a salted, deliberately slow hash on this Mac.</p>
</section></main></body></html>
