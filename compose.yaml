services:
  fly:
    build: .
    container_name: fly
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8877:8877"
    volumes:
      - ./data:/data
    environment:
      FLY_DB: /data/paper.db
      FLY_HOST: 0.0.0.0
      FLY_AUTH_PATH: /data/owner-auth.json
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8877/healthz', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
